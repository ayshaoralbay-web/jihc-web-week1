<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About</title>
</head>
<style>
     * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #e8decc;
      color: #30251d;
      font-family: Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

   

    .logo {
      color: white;
      font-size: 20px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    
.navbar {
  display: flex;
  align-items: center;
  padding: 22px 50px;
  background: #17222b;
}

.nav-links {
  display: flex;
  gap: 20px;
  list-style: none;
}

.nav-links a {
  color: white;
  text-decoration: none;
  font-size: 12px;
  margin-left: 20px;
}

    
    .footer {
      padding: 45px 50px;
      background: #30251d;
      color: white;
    }

    .footer-content {
      display: grid;
      grid-template-columns: 1.5fr repeat(4, 1fr);
      gap: 30px;
      max-width: 1100px;
      margin: auto;
    }

    .footer-logo {
      font-size: 22px;
      font-weight: bold;
    }

    .footer-column {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .footer-column h3 {
      margin: 0;
      font-size: 11px;
    }

    .footer-column a {
      color: #d8d0c5;
      font-size: 10px;
      text-decoration: none;
    }

    .about {
      max-width: 1100px;
      margin: 35px auto;
      padding: 30px;
      background: #f8f7f5;
      text-align: center;
    }

    .page-space {
      flex: 1;
    }

   
</style>
<body>
  <nav class="navbar"></nav>
  <main class="page-space"></main>
  <footer class="footer"></footer>
  
  <script src="index.js"></script>
</body>
</html>
