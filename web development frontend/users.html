<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Users</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: flex;
        flex-direction: column;
        background: #e8decc;
        color: #30251d;
        font-family: Arial, sans-serif;
      }

      .navbar {
        display: flex;
        align-items: center;
        padding: 22px 50px;
        background: #17222b;
      }

      .logo {
        color: white;
        font-size: 20px;
        font-weight: bold;
        letter-spacing: 2px;
      }

      .nav-links {
        display: flex;
        gap: 20px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .nav-links a {
        margin-left: 20px;
        color: white;
        font-size: 12px;
        text-decoration: none;
      }

      h2,
      .usersTable {
        width: min(1100px, calc(100% - 100px));
        margin-right: auto;
        margin-left: auto;
      }

      h2 {
        margin-top: 35px;
        margin-bottom: 20px;
      }

      .usersTable {
        flex: 1;
        margin-bottom: 35px;
        padding: 30px;
        background: #f8f7f5;
      }

      table {
        border-collapse: collapse;
        width: 100%;
      }

      th,
      td {
        border: 1px solid #999;
        padding: 10px;
        text-align: left;
      }

      th {
        background: #30251d;
        color: white;
      }

      .footer {
        padding: 45px 50px;
        background: #30251d;
        color: white;
      }

      .footer-content {
        display: grid;
        grid-template-columns: 1.5fr repeat(3, 1fr);
        gap: 30px;
        max-width: 1100px;
        margin: auto;
      }

      .footer-logo {
        font-size: 22px;
        font-weight: bold;
      }

      .footer-column {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .footer-column h3 {
        margin: 0;
        font-size: 11px;
      }

      .footer-column a {
        color: #d8d0c5;
        font-size: 10px;
        text-decoration: none;
      }

      @media (max-width: 700px) {
        .navbar {
          padding: 20px;
        }

        .nav-links {
          flex-wrap: wrap;
          gap: 8px;
        }

        .nav-links a {
          margin-left: 8px;
        }

        h2,
        .usersTable {
          width: calc(100% - 40px);
        }

        .usersTable {
          padding: 15px;
          overflow-x: auto;
        }

        .footer {
          padding: 30px 20px;
        }
      }
    </style>
  </head>
  <body>
    <nav class="navbar"></nav>
    <h2>Registered users</h2>
    <div class="usersTable"></div>

    <script>
      let usersTable = document.querySelector(".usersTable");
      let users = JSON.parse(localStorage.getItem("users")) || [];

      usersTable.innerHTML = `
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Name</th>
              <th>Email</th>
              <th>Age</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      `;

      let tableBody = usersTable.querySelector("tbody");

      users.forEach(function (element, index) {
        tableBody.innerHTML += `
          <tr>
            <td>${index + 1}</td>
            <td>${element.name}</td>
            <td>${element.email}</td>
            <td>${element.age}</td>
          </tr>
        `;
      });
    </script>
    <footer class="footer"></footer>
    <script src="index.js"></script>
  </body>
</html>
